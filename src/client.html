const StepsEd = {
  _pk:['preIntervention','intervention','postIntervention','return'],
  _pn:{preIntervention:'PRE-INTERVENCIÓN',intervention:'INTERVENCIÓN',postIntervention:'POST-INTERVENCIÓN',return:'RETORNO'},
  _pp:{preIntervention:'1',intervention:'2',postIntervention:'3',return:'4'},

  async open(cbaId){
    const cba=S.cbas.find(c=>c.id===cbaId); if(!cba){U.toast('CBA no encontrada','err');return;}
    S.editCBA={...cba};
    document.getElementById('mStepsTitle').textContent=`Pasos — ${cba.nombreCBA}`;
    U.load(true);
    try{
      const r=await API.getCBASteps(cbaId);
      S.editCBA.pasos=r.status==='ok'?r.pasos:{preIntervention:[],intervention:[],postIntervention:[],return:[]};
      this._pk.forEach(k=>this._renumber(k));
    }catch(_){ S.editCBA.pasos={preIntervention:[],intervention:[],postIntervention:[],return:[]}; }
    U.load(false);
    this._render(); Mod.open('mSteps');
  },

  _render(){
    const p=S.editCBA.pasos;
    document.getElementById('mStepsBody').innerHTML=this._pk.map(k=>{
      const steps=p[k]||[];
      return `<div class="steps-phase">
        <div class="steps-phase__hd">
          <span>${this._pn[k]}</span>
          <button class="btn btn-secondary btn--xs" onclick="StepsEd.add('${k}')">${U.icon('plus',12)} Agregar paso</button>
        </div>
        <div style="overflow-x:auto">
          <table class="steps-tbl" id="st-${k}">
            <thead><tr><th>Sec.</th><th>Tipo</th><th>Tipo de Tarea</th><th>Ámbito</th><th>Descripción</th><th>Responsable</th><th></th></tr></thead>
            <tbody>${steps.map((s,i)=>`<tr${s.tipoPaso==='COOKBOOK'?' style="opacity:.7;font-style:italic"':''}>
              <td style="width:70px"><input value="${U.esc(s.sec)}" readonly data-ph="${k}" data-i="${i}" data-f="sec" /></td>
              <td style="width:110px">
                <select data-ph="${k}" data-i="${i}" data-f="tipoPaso" onchange="StepsEd.retype('${k}',${i},this.value)">
                  <option value="CBA" ${s.tipoPaso!=='COOKBOOK'?'selected':''}>CBA (obligatorio)</option>
                  <option value="COOKBOOK" ${s.tipoPaso==='COOKBOOK'?'selected':''}>CookBook (opcional)</option>
                </select>
              </td>
              <td><input value="${U.esc(s.tipoTarea)}" placeholder="ej: Verificación" data-ph="${k}" data-i="${i}" data-f="tipoTarea" /></td>
              <td><input value="${U.esc(s.ambito||'')}" placeholder="ej: Perú" data-ph="${k}" data-i="${i}" data-f="ambito" /></td>
              <td><input value="${U.esc(s.descripcion)}" placeholder="${s.tipoPaso==='COOKBOOK'?'Según CBA':'Descripción del paso'}" data-ph="${k}" data-i="${i}" data-f="descripcion" /></td>
              <td><input value="${U.esc(s.responsable||'')}" placeholder="Responsable" data-ph="${k}" data-i="${i}" data-f="responsable" /></td>
              <td style="width:36px"><button class="btn btn-danger btn--xs btn--icon" onclick="StepsEd.rm('${k}',${i})">${U.icon('trash',12)}</button></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`;
    }).join('');
  },

  /** Renumera los pasos de una fase: CBA → "N.M" secuencial; COOKBOOK → "CB N,Ma" ligado al CBA precedente */
  _renumber(k){
    const steps=S.editCBA.pasos[k]||[];
    const prefix=this._pp[k];
    let cbaCounter=0, lastCbaNum='', cookbookSub=0;
    steps.forEach(s=>{
      if(s.tipoPaso==='COOKBOOK'){
        cookbookSub+=1;
        const letter=String.fromCharCode(96+cookbookSub);
        s.sec=lastCbaNum?`CB ${prefix},${lastCbaNum.split('.')[1]}${letter}`:`CB ${prefix}${letter}`;
      } else {
        cbaCounter+=1; cookbookSub=0;
        lastCbaNum=`${prefix}.${cbaCounter}`;
        s.sec=lastCbaNum;
      }
    });
  },

  retype(k,idx,value){
    this._sync();
    S.editCBA.pasos[k][idx].tipoPaso=value;
    this._renumber(k);
    this._render();
  },

  _sync(){
    document.querySelectorAll('[data-ph][data-i][data-f]').forEach(inp=>{
      const k=inp.dataset.ph,i=parseInt(inp.dataset.i),f=inp.dataset.f;
      if(S.editCBA.pasos[k]&&S.editCBA.pasos[k][i]) S.editCBA.pasos[k][i][f]=inp.value;
    });
  },

  add(k){
    this._sync();
    const steps=S.editCBA.pasos[k];
    steps.push({sec:'',tipoTarea:'',ambito:'',descripcion:'',responsable:'',tipoPaso:'CBA'});
    this._renumber(k);
    this._render();
    setTimeout(()=>{
      const rows=document.querySelectorAll(`#st-${k} tbody tr`);
      if(rows.length) rows[rows.length-1].querySelectorAll('input')[1]?.focus();
    },50);
  },

  rm(k,idx){
    this._sync();
    S.editCBA.pasos[k].splice(idx,1);
    this._renumber(k);
    this._render();
  },

  async save(){
    this._sync();
    U.load(true);
    try{
      const r=await API.saveCBASteps(S.editCBA.id,S.editCBA.pasos);
      if(r.status==='ok'){
        const t=Object.values(S.editCBA.pasos).reduce((s,a)=>s+a.length,0);
        const idx=S.cbas.findIndex(c=>c.id===S.editCBA.id);
        if(idx>=0) S.cbas[idx].estado=t>0?'Pasos definidos':'Pasos pendientes';
        Mod.close('mSteps'); V.cbas(); U.toast('Pasos guardados');
      } else U.toast(r.message,'err');
    }catch(e){ U.toast(String(e),'err'); }
    U.load(false);
  },
};

      }
      else U.toast(r.message,'err');
    }catch(e){ U.toast(String(e),'err'); }

  // ── Notificación en la web para checklists que se están creando en background ──
  _pollTimer:null,
  _pendingIds:null,
  startPendingPoll(){
    if(this._pollTimer) return; // ya hay un polling activo
    this._pollTimer=setInterval(async ()=>{
      let r;
      try{ r=await API.getMyChecklists(); }catch(e){ return; }
      if(!r||r.status!=='ok') return;
      const list=r.checklists||[];
      const pending=list.filter(c=>c.estado==='Creando...');
      const pendingIds=new Set(pending.map(c=>c.id));

      if(this._pendingIds){
        const finished=[...this._pendingIds].filter(id=>!pendingIds.has(id));
        finished.forEach(id=>{
          const found=list.find(c=>c.id===id);
          if(found && found.estado==='Error al crear') U.toast(`Error al crear el checklist ${found.crq}`,'err');
          else U.toast(`Checklist ${found?found.crq:''} listo ✓`);
        });
      }
      this._pendingIds=pendingIds;

      if(pendingIds.size===0){
        clearInterval(this._pollTimer); this._pollTimer=null; this._pendingIds=null;
      }
      if(R.cur==='checklists') V.checklists();
      else if(R.cur==='board') V.board();
    },5000);
  },

  async saveStep(phase, ri, sec){
    const {sid, cid} = S.editChecklist;
    const get = (col) => {
      const inp = document.querySelector(`[data-phase="${phase}"][data-row="${ri}"][data-col="${col}"]`);
      if (!inp) return '';
      let v = inp.value || '';
      if (inp.type === 'datetime-local' && v) v = v.replace('T', ' ');
      return v;
    };

    const inicioReal    = get(7);
    const finReal       = get(8);
    const nombreTecnico = get(9);
    const resultado     = get(10);

    if (!resultado) {
      U.toast('Selecciona un Resultado antes de guardar', 'err'); return;
    }

    // Feedback visual inmediato en el botón
    const btn = document.getElementById(`save-step-${phase.replace(/[^a-z0-9]/gi,'_')}-${ri}`);
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

    try {
      const r = await API.saveStepResult(sid, cid, sec, inicioReal, finReal, nombreTecnico, resultado);
      if (r.status === 'ok') {
        // Actualizar el estado en memoria para no recargar del servidor
        const ph = (S.editChecklist.phases||[]).find(p => p.name === phase);
        if (ph && ph.rows[ri]) ph.rows[ri][10] = resultado;

        U.toast(`Paso ${sec} guardado`);
        // Re-renderizar solo para actualizar la barra de progreso y el estado visual
        V._renderEditor();
        S.editDirty=false;
      } else {
        U.toast(r.message, 'err');
        if (btn) { btn.disabled = false; btn.innerHTML = `Guardar este paso`; }
      }
    } catch(e) {
      U.toast(String(e), 'err');
      if (btn) { btn.disabled = false; btn.innerHTML = `Guardar este paso`; }
    }
  },

  /* ── Hojas de soporte del checklist (Contactos, Servicios, Listado) ── */
  _supportData(){
    const ec=S.editChecklist;
    if(ec.support) return ec.support;
    const src=(S.supportData||{contactos:[],servicios:[],listado:[]});
    return {contactos:src.contactos||[],servicios:src.servicios||[],listado:src.listado||[]};
  },

  _supportHtml(){
    const isLider=S.isAL;
    const sup=this._supportData();
    const canEdit=isLider;
    const noEdit=canEdit?'':' readonly disabled';
    const ladCols=[
      'Cód','Área','Tipología de Cambio','Tipo cambio Europa','Tipo cambio América',
      'CBA homologada?','Cookbook homologado?','CBA (QUA%)','Europa L04','América L04',
      'Europa L05','América L05','Cookbook EUR','Cookbook AME','CBA','CookBook','URL','CBA / CooBook',
    ];

    // ── Lista de contactos ──
    const conRows=sup.contactos||[];
    let conHtml=canEdit?`<div class="sup-grid sup-row-hd" style="grid-template-columns:1fr 1fr 40px"><div>Nombre</div><div>Teléfono</div><div></div></div>`:'';
    conRows.forEach((r,i)=>{
      conHtml+=`<div class="sup-grid" style="grid-template-columns:1fr 1fr 40px">
        <input value="${U.esc(String(r[0]||''))}" data-sk="con" data-i="${i}" data-c="0"${noEdit} placeholder="Nombre del contacto">
        <input value="${U.esc(String(r[1]||''))}" data-sk="con" data-i="${i}" data-c="1"${noEdit} placeholder="Teléfono">
        ${canEdit?`<button class="btn btn-danger btn--xs btn--icon" onclick="Checklists.supportRm('con',${i})" title="Quitar">${U.icon('trash',13)}</button>`:''}
      </div>`;
    });
    if(canEdit) conHtml+=`<button class="btn btn-secondary btn--xs" onclick="Checklists.supportAdd('con')">${U.icon('plus',13)} Agregar contacto</button>`;
    else if(!conRows.length) conHtml=`<div style="font-size:.875rem;color:var(--gray-400)">Sin contactos registrados.</div>`;

    // ── Servicios afectados ──
    const serRows=sup.servicios||[];
    let serHtml=canEdit?`<div class="sup-grid sup-row-hd" style="grid-template-columns:1fr 40px"><div>Nombre del SERVICIO</div><div></div></div>`:'';
    serRows.forEach((s,i)=>{
      serHtml+=`<div class="sup-grid" style="grid-template-columns:1fr 40px">
        <input value="${U.esc(String(s))}" data-sk="ser" data-i="${i}"${noEdit} placeholder="Servicio afectado">
        ${canEdit?`<button class="btn btn-danger btn--xs btn--icon" onclick="Checklists.supportRm('ser',${i})" title="Quitar">${U.icon('trash',13)}</button>`:''}
      </div>`;
    });
    if(canEdit) serHtml+=`<button class="btn btn-secondary btn--xs" onclick="Checklists.supportAdd('ser')">${U.icon('plus',13)} Agregar servicio</button>`;
    else if(!serRows.length) serHtml=`<div style="font-size:.875rem;color:var(--gray-400)">Sin servicios registrados.</div>`;

    // ── Listado CookBook ──
    const ladRows=sup.listado||[];
    let ladHtml='';
    if(canEdit||ladRows.length){
      ladHtml=`<div class="sup-wrap"><table class="sup-tbl"><thead><tr>${
        ladCols.map(c=>`<th>${U.esc(c)}</th>`).join('')
      }</tr></thead><tbody>${
        ladRows.map((r,i)=>`<tr>${
          ladCols.map((_,c)=>`<td><input value="${U.esc(String(r[c]||''))}" data-sk="l" data-i="${i}" data-c="${c}"${noEdit}></td>`).join('')
        }</tr>`).join('')
      }</tbody></table></div>`;
    }
    if(canEdit){
      ladHtml+=`<div class="sup-actions">
        <button class="btn btn-secondary btn--xs" onclick="Checklists.supportAdd('l')">${U.icon('plus',13)} Agregar fila</button>
        <button class="btn btn-primary btn--xs" onclick="Checklists.supportLoadCat()">${U.icon('steps',13)} Cargar desde catálogo CBAs</button>
      </div>`;
    } else if(!ladRows.length) ladHtml=`<div style="font-size:.875rem;color:var(--gray-400)">Catálogo vacío.</div>`;

    const card=(title,ic,body,label)=>{
      return `<div class="card">
        <div class="card__hd">
          <div class="card__title">${U.icon(ic,17)} ${title}</div>
          ${canEdit?`<button class="btn btn-primary btn--xs" onclick="Checklists.supportSave('${label}')">${U.icon('save',13)} Guardar ${label==='con'?'Contactos':label==='ser'?'Servicios':'Catálogo'}</button>`:''}
        </div>
        <div class="card__body">${body}</div>
      </div>`;
    };

    return `<div style="margin:1.5rem 0 .5rem">
      <div style="font-weight:700;color:var(--gray-700);font-size:1.0625rem;margin-bottom:.75rem">Datos de soporte (se sincronizan con el sheet)</div>
      ${card('Lista de contactos','users',conHtml,'con')}
      ${card('Servicios afectados','building',serHtml,'ser')}
      ${card('Listado CookBook','list',ladHtml,'l')}
    </div>`;
  },

  supportAdd(kind){
    const ec=S.editChecklist;
    const sup=this._supportData();
    if(kind==='con') sup.contactos.push(['','']);
    else if(kind==='ser') sup.servicios.push('');
    else sup.listado.push(Array(18).fill(''));
    ec.support={...sup};
    V._renderEditor();
  },

  supportRm(kind,i){
    const ec=S.editChecklist;
    const sup=this._supportData();
    if(kind==='con') sup.contactos.splice(i,1);
    if(kind==='ser') sup.servicios.splice(i,1);
    if(kind==='l') sup.listado.splice(i,1);
    ec.support={...sup};
    V._renderEditor();
  },

  supportLoadCat(){
    const rows=(S.cbas||[]).filter(c=>c&&c.id).map(c=>[
      c.codigoArea||'',c.areaTecnica||'',c.nombreCBA||'',
      '','','','','','','','','','','',
      c.id||'',c.numeroCookbok||'',c.urlCBA||'',
      `${c.codificacionTipologia||''} ${c.nombreCBA||''}`.trim(),
    ]);
    if(!rows.length){ U.toast('No hay CBAs en el catálogo','err'); return; }
    const ec=S.editChecklist;
    const sup=this._supportData();
    sup.listado=rows;
    ec.support={...sup};
    V._renderEditor();
    U.toast(`${rows.length} CBAs cargadas al Listado CookBook`);
  },

  async supportSave(kind){
    const ec=S.editChecklist;
    const read=(sk)=>{
      const out=[];
      document.querySelectorAll(`[data-sk="${sk}"]`).forEach(inp=>{
        const i=+inp.dataset.i;
        if(sk==='ser'){ out[i]=inp.value||''; return; }
        const c=+inp.dataset.c;
        if(!out[i]) out[i]=[];
        out[i][c]=inp.value||'';
      });
      return out;
    };
    const contactos=(read('con')||[]).map(r=>[r?.[0]||'',r?.[1]||'']);
    const servicios=read('ser')||[];
    const listado=read('l')||[];
    U.load(true);
    try{
      const r=await API.saveSupportData(ec.sid,{contactos,servicios,listado});
      if(r.status==='ok'){
        ec.support={contactos,servicios,listado};
        if(S.supportData){ const c=Cache.get('support-'+ec.sid); if(c) Cache.invalidate('support-'+ec.sid); }
        U.toast(r.message);
      } else U.toast(r.message,'err');
    }catch(e){ U.toast(String(e),'err'); }
    U.load(false);
  },

  async migrate(){
    U.load(true);
    try{
      const r=await API.migrateChecklistSheets();
      U.toast(r.status==='ok'?r.message:(r.message||'Error'),r.status==='ok'?'': 'err');
      V.checklists();
    }catch(e){ U.toast(String(e),'err'); }
    U.load(false);
  },

  async openAssign(phase,ri,sec,curEmail){
    S.pendAssign={phase,ri,sec};
    S.assignScope='eq';
    document.getElementById('mAssignSec').textContent=sec;
    document.getElementById('mAssignSearch').value='';
    await this._loadUsers();
    this.renderAssign(curEmail);
    Mod.open('mAssign');
  },

  async _loadUsers(){
    if(S.users) return S.users;
    const r=await API.getUsers();
    S.users=(r.status==='ok'?r.users:[]);
    return S.users;
  },

  setScope(s){
    S.assignScope=s;
    this.renderAssign();
  },

  async renderAssign(selEmail){
    await this._loadUsers();
    const scope=S.assignScope||'eq';
    document.querySelectorAll('#mAssignScope .seg__btn').forEach(b=>b.classList.toggle('is-on',b.dataset.scope===scope));
    const users=S.users||[];
    const q=(document.getElementById('mAssignSearch').value||'').trim().toLowerCase();
    const myArea=String(S.user?.area||'').toLowerCase();
    const isMine=u=>String(u.area||'').toLowerCase()===myArea;
    const list=users.filter(u=>{
      if(String(u.activo)==='false'||u.activo===false) return false;
      if(scope==='eq'&&!isMine(u)) return false;
      if(q&&!u.email.toLowerCase().includes(q)&&!String(u.nombre||'').toLowerCase().includes(q)) return false;
      return true;
    });
    const sel=document.getElementById('mAssignUser');
    sel.innerHTML=(list.length===0
      ? `<option value="">Sin técnicos disponibles</option>`
      : list.map(u=>`<option value="${U.esc(u.email)}">${U.esc(u.nombre||u.email)} — ${U.esc(u.email)}</option>`).join(''));
    if(selEmail&&list.some(u=>u.email.toLowerCase()===String(selEmail).toLowerCase())){
      sel.value=selEmail;
    }
  },

  async confirmAssign(){
    const email=document.getElementById('mAssignUser').value;
    if(!email){U.toast('Selecciona al técnico','err');return;}
    const {sec,phase,ri}=S.pendAssign;
    const {cid}=S.editChecklist;
    Mod.close('mAssign'); U.load(true);
    try{
      const r=await API.assignStep(cid,sec,email);
      if(r.status==='ok'){
        S.editChecklist.assignments[sec]=email;
        V._renderEditor();
        U.toast(`Paso ${sec} asignado a ${email}`);
      } else U.toast(r.message,'err');
    }catch(e){ U.toast(String(e),'err'); }
    U.load(false);
  },

  async save(){
    const {sid,phases}=S.editChecklist;
    const payload=[];
    (phases||[]).forEach(ph=>{
      const rows=[];
      (ph.rows||[]).forEach((_,ri)=>{
        const row=[];
        for(let ci=0;ci<=10;ci++){
          if(ci===4){
            const hid=document.querySelector(`input[data-equipo="${ph.name}"][data-row="${ri}"]`);
            row.push(hid?hid.value:(ph.rows[ri][ci]||''));
          } else {
            const inp=document.querySelector(`[data-phase="${ph.name}"][data-row="${ri}"][data-col="${ci}"]`);
            if(inp){ let v=inp.value||''; if(inp.type==='datetime-local'&&v) v=v.replace('T',' '); row.push(v); }
            else row.push(ph.rows[ri]?ph.rows[ri][ci]||'':'');
          }
        }
        rows.push(row);
      });
      if(rows.length) payload.push({name:ph.name,startRow:ph.startRow,rows});
    });
    U.load(true);
    try{
      const r=await API.saveChecklistData(sid,{phases:payload});
      if(r.status==='ok'){ S.editDirty=false; R.go('checklists'); U.toast('Checklist guardado exitosamente'); }
      else U.toast(r.message,'err');
    }catch(e){ U.toast(String(e),'err'); }
    U.load(false);
  },

  async del(cid,sid,crq){
    if(!confirm(`¿Eliminar el checklist "${crq}"? Se eliminará el archivo de Drive y todas las asignaciones. Esta acción no se puede deshacer.`))return;
    U.load(true);
    try{
      const r=await API.deleteChecklist(cid,sid);
      if(r.status==='ok'){ V.checklists(); U.toast('Checklist eliminado'); }
      else U.toast(r.message,'err');
    }catch(e){ U.toast(String(e),'err'); }
    U.load(false);
  },
};

// ════════ TABLERO KANBAN ════════
const Board = {
  col(estado){
    const s=String(estado||'').trim().toLowerCase();
    if(s==='' || s.includes('borrador')) return 'Borrador';
    if(s.includes('bloq')) return 'Bloqueado';
    if(s.includes('comp')||s.includes('termin')||s.includes('cerr')) return 'Terminado';
    return 'En Progreso';
  },
  async move(cid, col){
    const card=document.querySelector(`.kb-card[data-id="${cid}"]`);
    const item=(S.boardList||[]).find(c=>c.id===cid);
    if(!card||!item){ V.board(); return; }
    const from=this.col(item.estado);
    if(from===col) return;
    const srcBody=document.querySelector(`.kb-col[data-col="${from}"] .kb-col__body`);
    const dstBody=document.querySelector(`.kb-col[data-col="${col}"] .kb-col__body`);
    if(!srcBody||!dstBody) return;

    // Movida optimista: mover la tarjeta y actualizar conteos al instante
    dstBody.appendChild(card);
    const sel=card.querySelector('.kb-card__sel');
    if(sel) sel.value=col;
    item.estado=col;
    this._sync();

    try{
      const r=await API.setChecklistEstado(cid, col);
      if(r.status==='ok'){ U.toast(r.message, 'ok', 1800); }
      else {
        // Revertir en caso de error
        srcBody.appendChild(card);
        if(sel) sel.value=from;
        item.estado=from;
        this._sync();
        U.toast(r.message,'err');
      }
    }catch(e){
      srcBody.appendChild(card);
      if(sel) sel.value=from;
      item.estado=from;
      this._sync();
      U.toast(String(e),'err');
    }
  },
  drop(e, col){
    e.preventDefault();
    e.currentTarget.classList.remove('kb-over');
    const cid=e.dataTransfer.getData('text/plain');
    if(cid) Board.move(cid, col);
  },
  toggleAll(){
    S.boardShowAll=!S.boardShowAll;
    V.board();
  },
  _sync(){
    const colMap={'Borrador':'var(--gray-600)','En Progreso':'var(--primary-dk)','Terminado':'var(--ok)','Bloqueado':'var(--danger)'};
    document.querySelectorAll('.kb-col').forEach(colEl=>{
      const name=colEl.dataset.col;
      const body=colEl.querySelector('.kb-col__body');
      const cards=body.querySelectorAll(':scope > .kb-card');
      const cnt=colEl.querySelector('.kb-col__count');
      if(cnt) cnt.textContent=cards.length;
      let empty=body.querySelector('.kb-empty');
      if(cards.length===0){
        if(!empty){ empty=document.createElement('div'); empty.className='kb-empty'; empty.textContent='Sin tareas'; body.appendChild(empty); }
      }else if(empty){ empty.remove(); }
    });
    // Recomponer el resumen del encabezado
    const sub=document.querySelector('#main .page-sub');
    const cols=['Borrador','En Progreso','Terminado','Bloqueado'];
    if(sub){
      const list=S.boardList||[];
      const cutoff=Date.now()-60*24*3600*1000;
      const count=!S.boardShowAll?list.filter(ch=>{
        const fc=String(ch.fechaCreacion||ch.fechaInicio||'').trim();
        if(!fc||fc==='undefined'||fc==='null') return true;
        const t=new Date(fc).getTime();
        return isNaN(t)?true:t>=cutoff;
      }).length:list.length;
      const parts=cols.map(n=>`<strong style="color:${colMap[n]}">${n}: ${list.filter(c=>Board.col(c.estado)===n).length}</strong>`);
      sub.innerHTML=`${count} tarea(s) ${S.boardShowAll?'':`<strong style="color:var(--primary)">(últimos 2 meses)</strong>`} · ${parts.join(' · ')}`;
    }
  },
};

// ════════ INIT ════════
async function init(){
  window.addEventListener('beforeunload',(e)=>{
    if(S.editDirty){ e.preventDefault(); e.returnValue=''; }
  });
  U.load(true);
  try{
    const ur=await API.getCurrentUser();
    if(ur.status!=='ok'){
      document.getElementById('authMsg').textContent=ur.message||'Sin acceso.';
      document.getElementById('authScreen').classList.remove('hidden');
      U.load(false); return;
    }
    S.user=ur.user;
    Shell.renderHeader(S.user);
    Shell.renderSidebar(S.user);
    document.getElementById('appShell').classList.remove('hidden');

    const [cr,ar]=await Promise.all([API.getCBAs(),API.getAreas()]);
    if(cr.status==='ok') S.cbas=cr.cbas;
    if(ar.status==='ok') S.areas=ar.areas;

    const first={ADMIN:'cbas','LIDER-TEAM':'board',OPERADOR:'checklists'};
    await R.go(first[S.user.rol]||'checklists');
  }catch(err){
    document.getElementById('authMsg').textContent='Error de inicialización: '+err;
    document.getElementById('authScreen').classList.remove('hidden');
  }
  U.load(false);
}
init();
</script>
